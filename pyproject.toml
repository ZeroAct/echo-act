[project]
name = "echo-act"
version = "0.1.0"
description = "Local Korean/English speech generation for the desktop"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.8",
    "supertonic==1.3.1",
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "psutil>=6.0",
    "fastmcp>=2.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
echoact = "echoact.__main__:main"
echoact-mcp = "echoact.mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echoact"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "engine: needs the real Supertonic weights on this machine",
    "audio: needs a working audio output device",
    "slow: takes more than a few seconds",
]
